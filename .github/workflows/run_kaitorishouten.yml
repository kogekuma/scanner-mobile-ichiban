name: Kaitorishouten Scraper

# fast / full の2モードを VPS cron から workflow_dispatch で発火する（GitHub schedule は間引かれるため）。
#   fast : Phase 1(携帯AJAX+家電/カメラAJAX)+Phase 5(ゲーム/トレカ等)。約7分。30分ごと。
#   full : 全フェーズ（+巨大な category/3 本体カタログ）。約22分。3時間ごと。
# fast は前回 full の JSON に上書き合成する（非fastカテゴリは前回値を保持）。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full or fast"
        required: false
        default: "full"

concurrency:
  group: kaitorishouten
  cancel-in-progress: false   # 実行中は次をキュー待機（fast/full が重なったら順番待ち）

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Clone Scanner repo (for base data and push)
        env:
          PAT: ${{ secrets.SCANNER_PAT }}
        run: git clone https://kogekuma:$PAT@github.com/kogekuma/Scanner.git scanner_repo

      - name: Run scraper (mode=${{ github.event.inputs.mode || 'full' }})
        run: python run_kaitorishouten.py --mode "${{ github.event.inputs.mode || 'full' }}" --base scanner_repo/docs/data/kaitorishouten.json

      - name: Push to Scanner repo
        env:
          PAT: ${{ secrets.SCANNER_PAT }}
        run: |
          if [ ! -f kaitorishouten.json ]; then
            echo "kaitorishouten.json が生成されていないためスキップ（失敗/0件/縮小ガード）"
            exit 0
          fi
          cp kaitorishouten.json scanner_repo/docs/data/kaitorishouten.json
          cd scanner_repo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/kaitorishouten.json
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "chore: update kaitorishouten data (${{ github.event.inputs.mode || 'full' }}) $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 他スクレイパーの並行 push と競合するため、rebase して最大6回リトライ
          for i in $(seq 1 6); do
            git push && { echo "pushed"; exit 0; }
            echo "push 競合、rebase して再試行 ($i)"
            git fetch origin master && git rebase origin/master || git rebase --abort
            sleep $((RANDOM % 4 + 1))
          done
          echo "push 6回失敗"; exit 1
